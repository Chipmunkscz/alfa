<script>
(function () {
  var P = window.__P__;
  var f = document.getElementById("f");
  var i = document.getElementById("p");
  var e = document.getElementById("e");
  var b = document.getElementById("b");
  /* WebCrypto only exists in a secure context. Served over https (or from
     localhost) it is there; opened as a data: URL, or over plain http on a
     LAN address, it is not. Without this check the very first call throws
     SYNCHRONOUSLY, before the promise chain exists, so the .catch below
     never runs and the button sits on "Unlocking..." forever — the reader
     gets no page and no reason. Verified 2026-08-27: that is exactly what
     happened. Say it plainly instead. */
  if (!window.crypto || !window.crypto.subtle) {
    b.disabled = true;
    e.style.display = "block";
    e.textContent = "This page needs a secure context to decrypt. Open it over https:// (or from a local web server) rather than straight from a data: URL.";
    return;
  }
  function bytes(s) { var d = atob(s), a = new Uint8Array(d.length); for (var k = 0; k < d.length; k++) a[k] = d.charCodeAt(k); return a; }
  function fail(m) { e.textContent = m; e.style.display = "block"; b.disabled = false; b.textContent = "Unlock"; i.focus(); i.select(); }
  window.addEventListener("error", function () { fail("Something went wrong unlocking this page."); });
  f.addEventListener("submit", function (ev) {
    ev.preventDefault();
    e.style.display = "none";
    if (!i.value) { fail("Enter the password."); return; }
    b.disabled = true; b.textContent = "Unlocking\u2026";
    crypto.subtle.importKey("raw", new TextEncoder().encode(i.value), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: bytes(P.salt), iterations: P.it, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      })
      .then(function (key) {
        return crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(P.iv) }, key, bytes(P.ct));
      })
      .then(function (pt) {
        var html = new TextDecoder().decode(pt);
        document.open(); document.write(html); document.close();
      })
      .catch(function () { fail("That password did not work."); });
  });
  i.focus();
})();
</script>
