<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Přihláška - CHIPMUNKS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        
        .form-container {
            max-width: 600px;
            margin: 30px auto;
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            text-align: center;
            color: #8B4513;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: Arial, sans-serif;
            transition: border-color 0.3s ease;
        }
        
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        input[type="date"]:focus,
        input[type="number"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #8B4513;
            box-shadow: 0 0 5px rgba(139, 69, 19, 0.2);
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
        
        .checkbox-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        input[type="checkbox"],
        input[type="radio"] {
            margin-right: 8px;
            cursor: pointer;
        }
        
        .checkbox-item {
            display: flex;
            align-items: center;
        }
        
        .checkbox-item label {
            margin-bottom: 0;
            font-weight: normal;
            cursor: pointer;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
        }
        
        button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .submit-button {
            background: linear-gradient(135deg, #8B4513 0%, #A0522D 100%);
            color: white;
            flex: 1;
            max-width: 200px;
        }
        
        .submit-button:hover {
            background: linear-gradient(135deg, #A0522D 0%, #8B4513 100%);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .reset-button {
            background-color: #ccc;
            color: #333;
            flex: 1;
            max-width: 200px;
        }
        
        .reset-button:hover {
            background-color: #bbb;
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-link a {
            color: #8B4513;
            text-decoration: none;
            font-weight: bold;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
        
        .required {
            color: red;
        }
        
        .info-box {
            background-color: #fff9e6;
            border-left: 4px solid #8B4513;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h1>Přihláška do kroužku CHIPMUNKS</h1>
        
        <div class="info-box">
            <strong>Poznámka:</strong> Všechna pole označená hvězdičkou <span class="required">*</span> jsou povinná.
        </div>
        
        <form action="mailto:info@chipmunks.cz?subject=Nová přihláška do kroužku CHIPMUNKS" method="POST" enctype="text/plain">
            
            <!-- ÚDAJE O DÍTĚTI -->
            <h2 style="color: #8B4513; font-size: 18px; margin-top: 0; margin-bottom: 15px; border-bottom: 2px solid #8B4513; padding-bottom: 10px;">Údaje o dítěti</h2>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="child_name">Jméno dítěte <span class="required">*</span></label>
                    <input type="text" id="child_name" name="Jméno dítěte" required>
                </div>
                <div class="form-group">
                    <label for="child_surname">Příjmení <span class="required">*</span></label>
                    <input type="text" id="child_surname" name="Příjmení" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="child_birth">Datum narození <span class="required">*</span></label>
                    <input type="date" id="child_birth" name="Datum narození" required>
                </div>
                <div class="form-group">
                    <label for="child_age">Věk <span class="required">*</span></label>
                    <input type="number" id="child_age" name="Věk" min="2" max="6" required>
                </div>
            </div>
            
            <!-- ÚDAJE O RODIČÍCH -->
            <h2 style="color: #8B4513; font-size: 18px; margin-top: 25px; margin-bottom: 15px; border-bottom: 2px solid #8B4513; padding-bottom: 10px;">Údaje o rodičích/zákonném zástupci</h2>
            
            <div class="form-group">
                <label for="parent_name">Jméno a příjmení <span class="required">*</span></label>
                <input type="text" id="parent_name" name="Jméno rodiče" required>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="parent_phone">Telefonní číslo <span class="required">*</span></label>
                    <input type="tel" id="parent_phone" name="Telefonní číslo" placeholder="+420 ..." required>
                </div>
                <div class="form-group">
                    <label for="parent_email">Email <span class="required">*</span></label>
                    <input type="email" id="parent_email" name="Email" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="parent_address">Adresa <span class="required">*</span></label>
                <input type="text" id="parent_address" name="Adresa" placeholder="Ulice, číslo, PSČ, Město" required>
            </div>
            
            <!-- INFORMACE O KROUŽKU -->
            <h2 style="color: #8B4513; font-size: 18px; margin-top: 25px; margin-bottom: 15px; border-bottom: 2px solid #8B4513; padding-bottom: 10px;">Informace o kroužku</h2>
            
            <div class="form-group">
                <label for="group">Vybrané skupiny <span class="required">*</span></label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="group1" name="Skupiny" value="Páteční grup (15:00-16:00)">
                        <label for="group1">Páteční grupa (15:00-16:00)</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="group2" name="Skupiny" value="Sobotní grupa (09:00-10:00)">
                        <label for="group2">Sobotní grupa (09:00-10:00)</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="group3" name="Skupiny" value="Sobotní grupa (10:30-11:30)">
                        <label for="group3">Sobotní grupa (10:30-11:30)</label>
                    </div>
                </div>
            </div>
            
            <!-- SPECIÁLNÍ POTŘEBY -->
            <div class="form-group">
                <label for="allergies">Alergie nebo speciální potřeby</label>
                <textarea id="allergies" name="Alergie a speciální potřeby" placeholder="Popište případné alergie, zdravotní omezení apod."></textarea>
            </div>
            
            <!-- SOUHLAS -->
            <h2 style="color: #8B4513; font-size: 18px; margin-top: 25px; margin-bottom: 15px; border-bottom: 2px solid #8B4513; padding-bottom: 10px;">Souhlasy</h2>
            
            <div class="form-group">
                <div class="checkbox-item">
                    <input type="checkbox" id="consent" name="Souhlas" value="Souhlasím se zpracováním osobních údajů" required>
                    <label for="consent">Souhlasím se zpracováním osobních údajů <span class="required">*</span></label>
                </div>
            </div>
            
            <div class="form-group">
                <div class="checkbox-item">
                    <input type="checkbox" id="photo" name="Fotografie" value="Souhlasím s fotografováním dítěte">
                    <label for="photo">Souhlasím s fotografováním dítěte na kroužku</label>
                </div>
            </div>
            
            <!-- POZNÁMKA -->
            <div class="form-group">
                <label for="notes">Další poznámky</label>
                <textarea id="notes" name="Další poznámky" placeholder="Napište jakékoliv další informace, které byste nám rádi sdělili..."></textarea>
            </div>
            
            <!-- TLAČÍTKA -->
            <div class="button-group">
                <button type="reset" class="reset-button">Vymazat</button>
                <button type="submit" class="submit-button">Odeslat přihlášku</button>
            </div>
            
        </form>
        
        <div class="back-link">
            <a href="index.html">← Zpět na úvodní stránku</a>
        </div>
    </div>

</body>
</html>
