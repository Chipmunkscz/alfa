<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Přihláška – Čiperkové</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="wrap" style="padding: 2.5rem 0;">
<h1 style="text-align:center;">📝 Přihláška dítěte</h1>

<form id="prihlaskaForm" class="card" style="margin-top:1.5rem;">

<fieldset>
<legend>Údaje o dítěti</legend>

<div class="form-row">
<div class="form-group">
<label for="child_name">Jméno dítěte</label>
<input type="text" id="child_name">
</div>
<div class="form-group">
<label for="child_surname">Příjmení</label>
<input type="text" id="child_surname">
</div>
</div>

<div class="form-group">
<label for="child_birth">Datum narození</label>
<input type="text" id="child_birth">
</div>
</fieldset>

<fieldset>
<legend>Údaje o rodičích / zákonném zástupci</legend>

<div class="form-group">
<label for="parent_name">Jméno a příjmení</label>
<input type="text" id="parent_name">
</div>

<div class="form-row">
<div class="form-group">
<label for="parent_phone">Telefonní číslo</label>
<input type="tel" id="parent_phone">
</div>
<div class="form-group">
<label for="parent_email">E-mail</label>
<input type="email" id="parent_email">
</div>
</div>

<div class="form-group">
<label for="parent_address">Adresa</label>
<input type="text" id="parent_address">
</div>
</fieldset>

<fieldset>
<legend>Osoba oprávněná k vyzvednutí dítěte</legend>

<div class="form-group">
<label for="pickup_name">Vyzvedávající osoba</label>
<input type="text" id="pickup_name">
</div>

<div class="form-group">
<label for="pickup_phone">Telefonní číslo</label>
<input type="tel" id="pickup_phone">
</div>
</fieldset>

<fieldset>
<legend>Zdravotní údaje</legend>

<div class="form-group">
<label for="insurance">Zdravotní pojišťovna</label>
<input type="text" id="insurance">
</div>

<div class="form-group">
<label for="allergies">Alergie nebo speciální poznámky</label>
<textarea id="allergies" placeholder="Popište případné alergie, zdravotní omezení apod."></textarea>
</div>
</fieldset>

<div class="button-group">
<button type="reset" class="reset-button">Vymazat</button>
<button type="submit">Odeslat přihlášku</button>
</div>

</form>

<div class="back-link">
<a href="obsah.html">← Zpět na přehled</a>
</div>
</main>

<script>
function bezDiakritiky(text) {
return text.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

var pole = [
["Jmeno ditete", "child_name"],
["Prijmeni", "child_surname"],
["Datum narozeni", "child_birth"],
["Jmeno rodice", "parent_name"],
["Telefonni cislo", "parent_phone"],
["Email", "parent_email"],
["Adresa", "parent_address"],
["Vyzvedavajici osoba", "pickup_name"],
["Telefon vyzvedavajici", "pickup_phone"],
["Zdravotni pojistovna", "insurance"],
["Alergie a poznamky", "allergies"]
];

document.getElementById("prihlaskaForm").addEventListener("submit", function(e) {
e.preventDefault();

var radky = [];
for (var i = 0; i < pole.length; i++) {
var hodnota = document.getElementById(pole[i][1]).value;
radky.push(pole[i][0] + ": " + hodnota);
}

var telo = bezDiakritiky(radky.join("\n"));
var odkaz = "mailto:info@chipmunks.cz"
+ "?subject=" + encodeURIComponent("CHIPMUNKS přihláška")
+ "&body=" + encodeURIComponent(telo);

window.location.href = odkaz;
});
</script>

</body>
</html>
