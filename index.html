<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Čiperkové – vstup</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="gate">
<div class="gate-box">
<img src="chipmunks titulka.jpg" alt="Čiperkové">

<h1>🐿️ Vítejte u Čiperků</h1>
<p class="lead" style="margin: 0 auto 1rem;">Zadejte prosím přístupový kód.</p>

<form onsubmit="return checkPassword(event)">
<div class="gate-row">
<input type="password" id="passwordInput" placeholder="Heslo…" autocomplete="off">
<button type="submit">Vstoupit</button>
</div>
<div class="error-message" id="errorMessage">Nesprávné heslo!</div>
</form>
</div>
</main>

<script>
const passwords = [
  "Veverky26-01",
"Veverky26-02",
"Veverky26-03",
"Veverky26-04",
"Veverky26-05",
"Veverky26-06",
"Veverky26-07",
"Veverky26-08",
"Veverky26-09",
"Veverky26-10",
"Veverky26-11",
"Veverky26-12",
"Veverky26-13",
"Veverky26-14",
"Veverky26-15",
"Veverky26-16"
];

function checkPassword(e) {
  e.preventDefault();
  const input = document.getElementById("passwordInput");
  const error = document.getElementById("errorMessage");
  const zadane = input.value.trim();

  if (passwords.includes(zadane)) {
    window.location.href = "obsah.html";
  } else {
    error.style.display = "block";
    input.value = "";
    input.focus();
  }
  return false;
}
</script>

</body>
</html>
